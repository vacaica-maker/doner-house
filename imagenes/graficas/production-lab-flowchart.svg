<line x1="330.0" y1="807" x2="330.0" y2="843" stroke="#84592B" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="330.0" y1="929" x2="330.0" y2="965" stroke="#84592B" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M110,586.0 L68,586.0 L68,416.0 L110,416.0" fill="none" stroke="#743014" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrow-acento)"/>
<text x="90" y="576.0" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="15" font-weight="700" fill="#B3261E">No</text>
<text x="360.0" y="673" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="15" font-weight="700" fill="#2E7D4F">Yes</text>
<path d="M110,1034.0 L30,1034.0 L30,233.5 L110,233.5" fill="none" stroke="#743014" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrow-acento)"/>
<text x="24" y="560.5" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#743014" transform="rotate(-90 24 560.5)">Next weekly cycle</text>
<path d="M550,1034.0 L580.0,1034.0 L580.0,209.5 L610,209.5" fill="none" stroke="#743014" stroke-width="2.5" marker-end="url(#arrow-acento)"/>
<rect x="110" y="60" width="440" height="60" rx="30.0" ry="30.0" fill="#84592B" stroke="#442D1C" stroke-width="2"/>
<text x="330.0" y="96.0" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFDF8">Weekly Cycle Begins</text>
<rect x="610" y="60" width="440" height="60" rx="30.0" ry="30.0" fill="#84592B" stroke="#442D1C" stroke-width="2"/>
<text x="830.0" y="96" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFDF8">Order Received (POS)</text>
<line x1="830.0" y1="120" x2="830.0" y2="156" stroke="#743014" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="610" y="156" width="440" height="107" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="156" width="7" height="107" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="183" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Read &amp; Confirm Order</text>
<text x="632" y="203" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Read the ticket aloud and confirm items,</text>
<text x="632" y="223" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">size and customizations before assembly.</text>
<text x="632" y="243" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">30 sec</text>
<rect x="110" y="156" width="440" height="155" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="110" y="156" width="7" height="155" rx="3" ry="3" fill="#84592B"/>
<text x="132" y="183" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Purchasing</text>
<text x="132" y="202" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Meat: 2×/week, from the approved</text>
<text x="144" y="221" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">supplier (§2.6.4)</text>
<text x="132" y="240" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Produce (lettuce, tomato, onion):</text>
<text x="144" y="259" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">3×/week, wholesale market</text>
<text x="132" y="278" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Pita, sauces, fries, beverages: 1×/week</text>
<rect x="110" y="347" width="440" height="138" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="110" y="347" width="7" height="138" rx="3" ry="3" fill="#84592B"/>
<text x="132" y="374" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Receiving &amp; Quality Check</text>
<text x="132" y="394" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Check temperature, expiration dates and</text>
<text x="132" y="414" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">delivered weight against the purchase</text>
<text x="132" y="434" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">order.</text>
<text x="132" y="452" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">≈15 min/delivery · Meat ≤4°C</text>
<polygon points="330.0,521 550,586.0 330.0,651 110,586.0" fill="#F6EBD6" stroke="#743014" stroke-width="2.5"/>
<text x="330.0" y="592.0" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#743014">Meets QC Standard?</text>
<rect x="110" y="687" width="440" height="120" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="110" y="687" width="7" height="120" rx="3" ry="3" fill="#84592B"/>
<text x="132" y="714" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Storage</text>
<text x="132" y="734" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Meat refrigerated before roasting; produce</text>
<text x="132" y="754" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">refrigerated; fries frozen; dry goods in</text>
<text x="132" y="774" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">the pantry.</text>
<path d="M110,843 L507.0,843 A43.0,43.0 0 0 1 507.0,929 L110,929 Z" fill="#F6EBD6" stroke="#6B4622" stroke-width="2.5" stroke-dasharray="1,0"/>
<text x="322.0" y="884.0" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6B4622">Marination Wait</text>
<text x="322.0" y="901.0" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="12" font-style="italic" fill="#9D9167">12–24 h before the cone goes on the rotisserie</text>
<rect x="110" y="965" width="440" height="138" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="110" y="965" width="7" height="138" rx="3" ry="3" fill="#84592B"/>
<text x="132" y="992" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Pre-Shift Prep</text>
<text x="132" y="1012" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Stack the marinated meat onto the</text>
<text x="132" y="1032" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">rotisserie skewer; cut vegetables into</text>
<text x="132" y="1052" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">service-ready portions; batch the sauce.</text>
<text x="132" y="1070" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">≈45–60 min before opening · Cone ≈8–10 kg</text>
<line x1="830.0" y1="263" x2="830.0" y2="299" stroke="#743014" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="610" y="299" width="440" height="147" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="299" width="7" height="147" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="326" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Cooking</text>
<text x="632" y="346" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">The cone roasts continuously on the</text>
<text x="632" y="366" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">vertical rotisserie through service;</text>
<text x="632" y="386" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">shaved as it cooks and replenished as it</text>
<text x="632" y="406" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">sells.</text>
<text x="632" y="426" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">Continuous · ≈2–3 h to cook a full cone</text>
<line x1="830.0" y1="446" x2="830.0" y2="482" stroke="#743014" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="610" y="482" width="440" height="87" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="482" width="7" height="87" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="509" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Carve</text>
<text x="632" y="529" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Shave meat from the cone for one combo.</text>
<text x="632" y="549" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">60 sec · 150 g</text>
<line x1="830.0" y1="569" x2="830.0" y2="605" stroke="#743014" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="610" y="605" width="440" height="67" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="605" width="7" height="67" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="632" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Warm Pita</text>
<text x="632" y="652" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">90 sec · 100 g</text>
<line x1="830.0" y1="672" x2="830.0" y2="708" stroke="#743014" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="610" y="708" width="440" height="147" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="708" width="7" height="147" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="735" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Add Toppings</text>
<text x="632" y="755" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">• Lettuce 25 g</text>
<text x="632" y="775" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">• Tomato 30 g</text>
<text x="632" y="795" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">• Onion 15 g</text>
<text x="632" y="815" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">• Sauce 35 g</text>
<text x="632" y="835" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">90 sec total</text>
<line x1="830.0" y1="855" x2="830.0" y2="891" stroke="#743014" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="610" y="891" width="440" height="67" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="891" width="7" height="67" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="918" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Wrap</text>
<text x="632" y="938" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">90 sec</text>
<line x1="830.0" y1="958" x2="830.0" y2="994" stroke="#743014" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="610" y="994" width="440" height="107" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="994" width="7" height="107" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="1021" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Fry Fresh Fries &amp; Pour Drink</text>
<text x="632" y="1041" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Fry a fresh batch of fries to order and</text>
<text x="632" y="1061" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">pour the soda.</text>
<text x="632" y="1081" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">240 sec · Fries 100 g · Soda 400 ml</text>
<line x1="830.0" y1="1101" x2="830.0" y2="1137" stroke="#743014" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="610" y="1137" width="440" height="87" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="1137" width="7" height="87" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="1164" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Packaging</text>
<text x="632" y="1184" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Branded wrap/box, fries sleeve, cup with</text>
<text x="632" y="1204" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">lid.</text>
<line x1="830.0" y1="1224" x2="830.0" y2="1260" stroke="#743014" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M610,1260 L1050,1260 L1050,1350 C975.2,1358 865.2,1342 830.0,1350 C794.8,1358 684.8,1358 610,1350 Z" fill="#FFFDF8" stroke="#743014" stroke-width="2.5"/>
<text x="632" y="1287" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#743014">Print Receipt</text>
<text x="632" y="1307" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Includes the referral QR code (§3.4.4).</text>
<line x1="830.0" y1="1350" x2="830.0" y2="1364" stroke="#743014" stroke-width="2.5" marker-end="url(#arrow)"/>
<ellipse cx="830.0" cy="1364" rx="220.0" ry="14" fill="#F6EBD6" stroke="#743014" stroke-width="2.5"/>
<path d="M610,1364 A220.0,14 0 0 0 1050,1364 L1050,1430 A220.0,14 0 0 1 610,1430 Z" fill="#F6EBD6" stroke="#743014" stroke-width="2.5"/>
<text x="830.0" y="1389" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#743014">Log Sale in POS/MIS</text>
<text x="830.0" y="1405" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="12" fill="#442D1C">Feeds R&amp;D data (§3.7.1) and the MIS stack</text>
<text x="830.0" y="1421" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="12" fill="#442D1C">(§3.8)</text>
<line x1="830.0" y1="1430" x2="830.0" y2="1466" stroke="#743014" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="610" y="1466" width="440" height="60" rx="30.0" ry="30.0" fill="#743014" stroke="#442D1C" stroke-width="2"/>
<text x="830.0" y="1492" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFDF8">Service Handoff</text>
<text x="830.0" y="1510" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#FFFDF8">≈600 sec / 10 min total, from Order Received</text>
</svg>
