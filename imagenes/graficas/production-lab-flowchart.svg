<path d="M510,764.0 L540.0,764.0 L540.0,139.0 L570,139.0" fill="none" stroke="#743014" stroke-width="2.5" marker-end="url(#arrow-acento)"/>
<rect x="70" y="60" width="440" height="60" rx="30.0" ry="30.0" fill="#84592B" stroke="#442D1C" stroke-width="2"/>
<text x="290.0" y="96.0" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFDF8">Weekly Cycle Begins</text>
<rect x="70" y="156" width="440" height="155" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="70" y="156" width="7" height="155" rx="3" ry="3" fill="#84592B"/>
<text x="92" y="183" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Purchasing</text>
<text x="92" y="202" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Meat: 2×/week, from the approved</text>
<text x="104" y="221" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">supplier (§2.6.4)</text>
<text x="92" y="240" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Produce (lettuce, tomato, onion):</text>
<text x="104" y="259" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">3×/week, wholesale market</text>
<text x="92" y="278" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Pita, sauces, fries, beverages: 1×/week</text>
<rect x="70" y="347" width="440" height="138" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="70" y="347" width="7" height="138" rx="3" ry="3" fill="#84592B"/>
<text x="92" y="374" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Receiving &amp; Quality Check</text>
<text x="92" y="394" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Check temperature, expiration dates and</text>
<text x="92" y="414" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">delivered weight; reject or return non-</text>
<text x="92" y="434" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">conforming batches.</text>
<text x="92" y="452" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">≈15 min/delivery · Meat ≤4°C</text>
<rect x="70" y="521" width="440" height="138" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="70" y="521" width="7" height="138" rx="3" ry="3" fill="#84592B"/>
<text x="92" y="548" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Storage</text>
<text x="92" y="568" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Meat marinates refrigerated before</text>
<text x="92" y="588" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">roasting; produce refrigerated; fries</text>
<text x="92" y="608" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">frozen; dry goods in the pantry.</text>
<text x="92" y="626" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">Marination: 12–24 h</text>
<rect x="70" y="695" width="440" height="138" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="70" y="695" width="7" height="138" rx="3" ry="3" fill="#84592B"/>
<text x="92" y="722" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Pre-Shift Prep</text>
<text x="92" y="742" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Stack the marinated meat onto the</text>
<text x="92" y="762" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">rotisserie skewer; cut vegetables into</text>
<text x="92" y="782" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">service-ready portions; batch the sauce.</text>
<text x="92" y="800" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">≈45–60 min before opening · Cone ≈8–10 kg</text>
<rect x="570" y="60" width="440" height="158" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="570" y="60" width="7" height="158" rx="3" ry="3" fill="#84592B"/>
<text x="592" y="87" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Cooking</text>
<text x="592" y="107" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">The cone roasts continuously on the</text>
<text x="592" y="127" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">vertical rotisserie through service;</text>
<text x="592" y="147" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">shaved as it cooks and replenished as it</text>
<text x="592" y="167" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">sells.</text>
<text x="592" y="185" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">Continuous · ≈2–3 h to cook a full cone</text>
<rect x="570" y="254" width="440" height="98" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="570" y="254" width="7" height="98" rx="3" ry="3" fill="#84592B"/>
<text x="592" y="281" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Carve</text>
<text x="592" y="301" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Shave meat from the cone for one combo.</text>
<text x="592" y="319" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">20 sec · 150 g</text>
<rect x="570" y="388" width="440" height="78" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="570" y="388" width="7" height="78" rx="3" ry="3" fill="#84592B"/>
<text x="592" y="415" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Warm Pita</text>
<text x="592" y="433" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">40 sec · 100 g</text>
<rect x="570" y="502" width="440" height="154" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="570" y="502" width="7" height="154" rx="3" ry="3" fill="#84592B"/>
<text x="592" y="529" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Add Toppings</text>
<text x="592" y="548" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Lettuce 25 g</text>
<text x="592" y="567" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Tomato 30 g</text>
<text x="592" y="586" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Onion 15 g</text>
<text x="592" y="605" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Sauce 35 g</text>
<text x="592" y="623" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">35 sec total</text>
<rect x="570" y="692" width="440" height="78" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="570" y="692" width="7" height="78" rx="3" ry="3" fill="#84592B"/>
<text x="592" y="719" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Wrap</text>
<text x="592" y="737" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">15 sec</text>
<rect x="570" y="806" width="440" height="98" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="570" y="806" width="7" height="98" rx="3" ry="3" fill="#84592B"/>
<text x="592" y="833" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Portion Sides</text>
<text x="592" y="853" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Portion the fries and pour the soda.</text>
<text x="592" y="871" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">15 sec · Fries 100 g · Soda 400 ml</text>
<rect x="570" y="940" width="440" height="120" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="570" y="940" width="7" height="120" rx="3" ry="3" fill="#84592B"/>
<text x="592" y="967" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Packaging</text>
<text x="592" y="987" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Branded wrap/box, fries sleeve, cup with</text>
<text x="592" y="1007" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">lid, receipt with the referral QR code</text>
<text x="592" y="1027" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">(§3.4.4).</text>
<rect x="570" y="1096" width="440" height="60" rx="30.0" ry="30.0" fill="#743014" stroke="#442D1C" stroke-width="2"/>
<text x="790.0" y="1132.0" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFDF8">Service Handoff — ≈125 sec / 2.1 min Total</text>
</svg>