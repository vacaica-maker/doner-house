<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 1222" width="1070" height="1222" role="img" aria-label="Production Lab flowchart: Medium Döner Kebab Combo, from purchasing to service">
  <title>Production Lab flowchart: Medium Döner Kebab Combo, from purchasing to service</title>
  <rect x="0" y="0" width="1070" height="1222" fill="#E8D1A7" opacity="0.35"/>
