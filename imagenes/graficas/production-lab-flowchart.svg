<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 1566" width="1110" height="1566" role="img" aria-label="Production Lab flowchart: Medium Döner Kebab Combo, from purchasing to service, with swimlanes for Store Manager and Store Associates. Kitchen line opens with Order Received, then a Read &amp; Confirm Order step, before Cooking. Fries are now fried fresh to order rather than pre-batched. Assembly (Read &amp; Confirm Order through Fry Fresh Fries &amp; Pour Drink) totals ≈600 sec / ≈10 min, matching the Fast Service Guarantee's 10-minute promise (3.4.3).">
  <title>Production Lab flowchart: Medium Döner Kebab Combo, from purchasing to service, with swimlanes for Store Manager and Store Associates</title>
  <rect x="0" y="0" width="1110" height="1566" fill="#E8D1A7" opacity="0.35"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#84592B"/>
    </marker>
    <marker id="arrow-acento" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#743014"/>
    </marker>
  </defs>
