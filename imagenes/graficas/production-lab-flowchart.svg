<text x="330.0" y="96.0" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFDF8">Weekly Cycle Begins</text>
<rect x="110" y="156" width="440" height="155" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="110" y="156" width="7" height="155" rx="3" ry="3" fill="#84592B"/>
<text x="132" y="183" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Purchasing</text>
<text x="132" y="202" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Meat: 2×/week, from the approved</text>
<text x="144" y="221" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">supplier (§2.6.4)</text>
<text x="132" y="240" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Produce (lettuce, tomato, onion):</text>
<text x="144" y="259" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">3×/week, wholesale market</text>
<text x="132" y="278" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Pita, sauces, fries, beverages: 1×/week</text>
<rect x="110" y="347" width="440" height="138" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="110" y="347" width="7" height="138" rx="3" ry="3" fill="#84592B"/>
<text x="132" y="374" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Receiving &amp; Quality Check</text>
<text x="132" y="394" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Check temperature, expiration dates and</text>
<text x="132" y="414" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">delivered weight against the purchase</text>
<text x="132" y="434" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">order.</text>
<text x="132" y="452" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">≈15 min/delivery · Meat ≤4°C</text>
<polygon points="330.0,521 550,586.0 330.0,651 110,586.0" fill="#F6EBD6" stroke="#743014" stroke-width="2.5"/>
<text x="330.0" y="592.0" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#743014">Meets QC Standard?</text>
<rect x="110" y="687" width="440" height="120" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="110" y="687" width="7" height="120" rx="3" ry="3" fill="#84592B"/>
<text x="132" y="714" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Storage</text>
<text x="132" y="734" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Meat refrigerated before roasting; produce</text>
<text x="132" y="754" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">refrigerated; fries frozen; dry goods in</text>
<text x="132" y="774" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">the pantry.</text>
<path d="M110,843 L507.0,843 A43.0,43.0 0 0 1 507.0,929 L110,929 Z" fill="#F6EBD6" stroke="#6B4622" stroke-width="2.5" stroke-dasharray="1,0"/>
<text x="322.0" y="884.0" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6B4622">Marination Wait</text>
<text x="322.0" y="901.0" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="12" font-style="italic" fill="#9D9167">12–24 h before the cone goes on the rotisserie</text>
<rect x="110" y="965" width="440" height="138" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="110" y="965" width="7" height="138" rx="3" ry="3" fill="#84592B"/>
<text x="132" y="992" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Pre-Shift Prep</text>
<text x="132" y="1012" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Stack the marinated meat onto the</text>
<text x="132" y="1032" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">rotisserie skewer; cut vegetables into</text>
<text x="132" y="1052" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">service-ready portions; batch the sauce.</text>
<text x="132" y="1070" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">≈45–60 min before opening · Cone ≈8–10 kg</text>
<rect x="610" y="60" width="440" height="158" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="60" width="7" height="158" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="87" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Cooking</text>
<text x="632" y="107" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">The cone roasts continuously on the</text>
<text x="632" y="127" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">vertical rotisserie through service;</text>
<text x="632" y="147" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">shaved as it cooks and replenished as it</text>
<text x="632" y="167" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">sells.</text>
<text x="632" y="185" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">Continuous · ≈2–3 h to cook a full cone</text>
<rect x="610" y="254" width="440" height="98" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="254" width="7" height="98" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="281" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Carve</text>
<text x="632" y="301" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Shave meat from the cone for one combo.</text>
<text x="632" y="319" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">20 sec · 150 g</text>
<rect x="610" y="388" width="440" height="78" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="388" width="7" height="78" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="415" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Warm Pita</text>
<text x="632" y="433" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">40 sec · 100 g</text>
<rect x="610" y="502" width="440" height="154" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="502" width="7" height="154" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="529" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Add Toppings</text>
<text x="632" y="548" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Lettuce 25 g</text>
<text x="632" y="567" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Tomato 30 g</text>
<text x="632" y="586" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Onion 15 g</text>
<text x="632" y="605" font-family="'Raleway', Arial, sans-serif" font-size="13.5" fill="#442D1C">&#8226; Sauce 35 g</text>
<text x="632" y="623" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">35 sec total</text>
<rect x="610" y="692" width="440" height="78" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="692" width="7" height="78" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="719" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Wrap</text>
<text x="632" y="737" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">15 sec</text>
<rect x="610" y="806" width="440" height="98" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="806" width="7" height="98" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="833" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Portion Sides</text>
<text x="632" y="853" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Portion the fries and pour the soda.</text>
<text x="632" y="871" font-family="'Raleway', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9D9167">15 sec · Fries 100 g · Soda 400 ml</text>
<rect x="610" y="940" width="440" height="100" rx="12" ry="12" fill="#FFFDF8" stroke="#84592B" stroke-width="2"/>
<rect x="610" y="940" width="7" height="100" rx="3" ry="3" fill="#84592B"/>
<text x="632" y="967" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#6B4622">Packaging</text>
<text x="632" y="987" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Branded wrap/box, fries sleeve, cup with</text>
<text x="632" y="1007" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">lid.</text>
<path d="M610,1076 L1050,1076 L1050,1166 C975.2,1174 865.2,1158 830.0,1166 C794.8,1174 684.8,1174 610,1166 Z" fill="#FFFDF8" stroke="#743014" stroke-width="2.5"/>
<text x="632" y="1103" font-family="'Raleway', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#743014">Print Receipt</text>
<text x="632" y="1123" font-family="'Raleway', Arial, sans-serif" font-size="14" fill="#442D1C">Includes the referral QR code (§3.4.4).</text>
<path d="M610,1228 A220.0,14 0 0 0 1050,1228 L1050,1294 A220.0,14 0 0 1 610,1294 Z" fill="#F6EBD6" stroke="#743014" stroke-width="2.5"/>
