<rect x="100" y="330" width="141.2" height="14" rx="7" fill="#84592B"/>
<text x="170.6" y="340.5" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.4" fill="#FFFDF8">STORE ASSOCIATE (PREP)</text>
<rect x="590" y="0" width="480" height="1566" fill="rgba(132,89,43,0.07)"/>
<rect x="600" y="43" width="141.2" height="14" rx="7" fill="#84592B"/>
<text x="670.6" y="53.5" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.4" fill="#FFFDF8">STORE ASSOCIATE (LINE)</text>
<text x="330.0" y="28" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="17" font-weight="700" fill="#84592B">SUPPLY CHAIN (WEEKLY CADENCE)</text>
<text x="830.0" y="28" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="17" font-weight="700" fill="#743014">KITCHEN LINE (PER ORDER, ≈10 MIN)</text>
