<text x="830.0" y="1258" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#743014">Log Sale in POS/MIS</text>
<text x="830.0" y="1274" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="12" fill="#442D1C">Feeds R&amp;D data (§3.7.1) and the MIS stack</text>
<text x="830.0" y="1290" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="12" fill="#442D1C">(§3.8)</text>
<rect x="610" y="1344" width="440" height="60" rx="30.0" ry="30.0" fill="#743014" stroke="#442D1C" stroke-width="2"/>
<text x="830.0" y="1380.0" text-anchor="middle" font-family="'Raleway', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFDF8">Service Handoff — ≈125 sec / 2.1 min Total</text>
